<html>
  <head>
    <title>Finova</title>
    <link rel="stylesheet" href="p.css">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="chat">
    <i class="fa-brands fa-whatsapp"></i></div>
    <main>
      <nav>
        <div class="logo">
          <img
            src="https://finova.in/public/assets/front/images/new/log--heigh.png"
            alt="logo"
          />
          <span>Finova</span>
        </div>
        <div class="menu">
          <div class="menu-link">
            <a href="">Products</a>
            <i class="fa-solid fa-angle-down"></i>
          </div>

          <div class="menu-link">
            <a href="">Pricing</a>
          </div>

          <div class="menu-link">
            <a href="">Features</a>
            <i class="fa-solid fa-angle-down"></i>
          </div>

          <div class="menu-link">
            <a href="">Resources</a>
            <i class="fa-solid fa-angle-down"></i>
          </div>
        </div>
        <div class="buttons">
          <button class="login-btn">Login</button>
          <button class="demo-btn">Get a demo</button>
        </div>
      </nav>
      <section class="hero">
        <div class="hero-left">
          <div class="chip-1">
            <i class="fa-solid fa-rocket"></i>
            <span>Smart finance for changemakers</span>
          </div>

          <h2>Finance that <span>works</span> as hard as you do</h2>

          <p>
            A seamless platform to track spending, set savings goals, and begin
            investing-all in one place. Take control today.
          </p>

          <div class="hero-buttons">
            <button class="x">Get Started</button>
            <button class="y">Explore Features</button>
          </div>
          <span>Built for everyday people, powered by smart finance</span>
          <div class="brands-list">
            <div class="brand">
              <img
                src="kinetic.png"
                alt="kinetic"
              />
            </div>
            <div class="brand">
              <img src="google.png" alt="google"/>
            </div>
            <div class="brand">
              <img
                src="apple.png"
                alt="apple"/>
            </div>
          </div>
        </div>
        <div class="hero-right">
            <img src="fin.png" alt="right-img"/>
        </div>
      </section>
    </main>
    <div class="footer">
      
    </div>
  </body>
</html>
